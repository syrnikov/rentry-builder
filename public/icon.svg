<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS (Big Sur+) app icon: 824px rounded plate on a 1024 grid, with drop shadow. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa3ff"/>
      <stop offset="1" stop-color="#0062e0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f1f4"/>
    </linearGradient>
    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00245a" flood-opacity="0.30"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#00245a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g transform="translate(100 100)">
    <rect width="824" height="824" rx="185" fill="url(#plate)" filter="url(#plateShadow)"/>
    <rect x="1.5" y="1.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>
    <!-- page -->
    <rect x="132" y="112" width="560" height="600" rx="48" fill="url(#page)" filter="url(#soft)"/>
    <rect x="172" y="152" width="480" height="120" rx="22" fill="#d6e8ff"/>
    <circle cx="246" cy="276" r="58" fill="#007aff" stroke="#fff" stroke-width="12"/>
    <rect x="324" y="296" width="210" height="24" rx="12" fill="#1d1d1f"/>
    <rect x="324" y="336" width="150" height="18" rx="9" fill="#c7c7cc"/>
    <rect x="172" y="394" width="228" height="136" rx="20" fill="#e9e9ee"/>
    <rect x="424" y="394" width="228" height="136" rx="20" fill="#e9e9ee"/>
    <rect x="172" y="564" width="480" height="18" rx="9" fill="#dcdce1"/>
    <rect x="172" y="602" width="380" height="18" rx="9" fill="#dcdce1"/>
    <rect x="172" y="640" width="420" height="18" rx="9" fill="#dcdce1"/>
    <!-- block being dragged in -->
    <g transform="rotate(-7 592 566)" filter="url(#lift)">
      <rect x="442" y="500" width="300" height="132" rx="24" fill="#fff" stroke="#007aff" stroke-width="9"/>
      <rect x="480" y="538" width="168" height="22" rx="11" fill="#007aff"/>
      <rect x="480" y="578" width="222" height="16" rx="8" fill="#c7c7cc"/>
    </g>
  </g>
</svg>
